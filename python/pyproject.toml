[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "rvegen"
version = "0.1.0"
description = "RVE (Representative Volume Element) generator for FFT/FEM homogenization — Python bindings"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Peter Lenz", email = "peterlenz89.pl@gmail.com" },
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/NumSim-Stack/numsim-rvegen"

[tool.scikit-build]
# CMake source dir is python/, which adds the parent rvegen tree as a
# subdirectory when invoked standalone.
cmake.source-dir = "."
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["rvegen"]

[tool.cibuildwheel]
# CPython 3.10-3.13, manylinux x86_64 (musllinux and PyPy skipped).
# Driven by .github/workflows/wheels.yml, which checks numsim-core out into
# <repo>/_deps/numsim-core so the container sees it (cibuildwheel mounts the
# repo root as /project).
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* pp*"
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest", "numpy"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.linux]
# rvegen needs C++23 <print>: the manylinux_2_28 image's default
# gcc-toolset is >= 14. Boost headers come from the distro; Eigen and
# nlohmann_json fall back to CMake FetchContent.
before-all = "yum install -y boost-devel"
environment = { CMAKE_ARGS = "-DCMAKE_CXX_FLAGS=-I/project/_deps/numsim-core/include -DBUILD_TESTING=OFF" }
