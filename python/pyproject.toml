[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "rvegen"
version = "0.1.0"
description = "RVE (Representative Volume Element) generator for FFT/FEM homogenization — Python bindings"
readme = "README.md"
# LICENSE and THIRD_PARTY_NOTICES.md are copies of the files at the repository
# root (the wheel is built from python/ alone); the license_files_in_sync_*
# ctests fail when they differ.
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Peter Lenz", email = "peterlenz89.pl@gmail.com" },
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/NumSim-Stack/numsim-rvegen"

[tool.scikit-build]
# CMake source dir is python/, which adds the parent rvegen tree as a
# subdirectory when invoked standalone.
cmake.source-dir = "."
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["rvegen"]
