name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Hard cap: a stuck FetchContent download or pathological test
    # shouldn't hold a runner for the GitHub default 6h. Sanitizer builds
    # run several times slower, so they get more headroom.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release is what ships; it also runs the install + smoke-consumer
          # and Python-bindings steps (`full`).
          - name: "gcc-14 Release (install, smoke-consume, python)"
            cc: gcc-14
            cxx: g++-14
            build_type: Release
            cxx_flags: ""
            full: true
            timeout: 30
          # Debug keeps assertions and the dynamic_cast checks in
          # collision_dispatcher::dispatch alive, and ASan + UBSan flag the
          # UB class behind #75 (uniform_real a > b) and #80 (PLY
          # double -> size_t casts). UBSan failures are fatal
          # (-fno-sanitize-recover) so they fail the job instead of just
          # printing a diagnostic.
          - name: "gcc-14 Debug (ASan + UBSan)"
            cc: gcc-14
            cxx: g++-14
            build_type: Debug
            cxx_flags: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
            full: false
            timeout: 60
          # Clang from the LLVM apt repo paired with libstdc++-14, which
          # provides <print>. A second front end catches argument-order /
          # evaluation-order dependence (#76) and clang-only template errors.
          - name: "clang-19 Release (libstdc++-14)"
            cc: clang-19
            cxx: clang++-19
            build_type: Release
            cxx_flags: ""
            full: false
            timeout: 30

    steps:
      - name: Checkout rvegen
        uses: actions/checkout@v4
        with:
          path: numsim-rvegen/rvegen

      # numsim-core is pinned to a known-good SHA so a breaking change
      # on numsim-core's main doesn't cascade into every rvegen PR.
      # Bump deliberately - see CONTRIBUTING.md for the procedure.
      # The pin must be at or after ef6d2ac ("make the installed package
      # consumable"): rvegen consumes numsim-core through its installed
      # CMake package (numsim-core::numsim-core).
      - name: Checkout numsim-core (pinned)
        uses: actions/checkout@v4
        with:
          repository: NumSim-Stack/numsim-core
          ref: b75a462ef9a11f92e2db0af7bc8bb803e60e62f9
          path: numsim-core

      # GCC 14 for `<print>` (numsim-core needs C++23 lib support); the
      # Clang job reuses its libstdc++-14. libboost-dev for `Boost::headers`.
      # nlohmann-json3-dev / libeigen3-dev keep those two on the
      # find_package path: FetchContent'd targets aren't in any export set,
      # so `install(EXPORT rvegenTargets)` would fail. gmsh enables the
      # .geo meshing checks (gmsh_geo_roundtrip_test and the per-example CLI
      # checks); numpy + matplotlib enable the gallery smoke test.
      - name: Install toolchain + system deps
        run: |
          sudo apt-get update
          if [[ "${{ matrix.cxx }}" == clang* ]]; then
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
              sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
              sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
            sudo apt-get install -y clang-19
          fi
          sudo apt-get install -y g++-14 libstdc++-14-dev ninja-build \
            libboost-dev nlohmann-json3-dev libeigen3-dev \
            python3-numpy python3-matplotlib
          sudo apt-get install -y --no-install-recommends gmsh

      # Build + install numsim-core so rvegen finds it with
      # find_package(numsim-core CONFIG), exactly as a downstream user would.
      - name: Build and install numsim-core
        working-directory: numsim-core
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -G Ninja -B build -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --install build --prefix "$GITHUB_WORKSPACE/deps"

      - name: Configure rvegen
        working-directory: numsim-rvegen/rvegen
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      - name: Build rvegen
        working-directory: numsim-rvegen/rvegen
        run: cmake --build build --parallel

      - name: Test rvegen
        working-directory: numsim-rvegen/rvegen
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 2

      # Install + smoke-consume: verifies the CMake export works
      # end-to-end. A separate consumer project does
      # find_package(rvegen CONFIG REQUIRED) and links via
      # rvegen::rvegen, then compiles a minimal program. numsim-core comes
      # in transitively through rvegenConfig.cmake (find_dependency).
      - name: Install rvegen to a temp prefix
        if: matrix.full
        working-directory: numsim-rvegen/rvegen
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/install"

      - name: Configure smoke consumer
        if: matrix.full
        working-directory: numsim-rvegen/rvegen/tests/install_smoke
        env:
          CXX: g++-14
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install;$GITHUB_WORKSPACE/deps"

      - name: Build smoke consumer
        if: matrix.full
        working-directory: numsim-rvegen/rvegen/tests/install_smoke
        run: cmake --build build

      - name: Run smoke consumer
        if: matrix.full
        working-directory: numsim-rvegen/rvegen/tests/install_smoke
        run: ./build/install_smoke

      # Python bindings test - guarded on the existence of the test
      # file so this workflow degrades gracefully on branches that
      # haven't yet picked up the pytest fixture (PR #28).
      - name: Set up Python
        if: matrix.full && hashFiles('numsim-rvegen/rvegen/python/tests/test_shapes.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build & test Python bindings
        if: matrix.full && hashFiles('numsim-rvegen/rvegen/python/tests/test_shapes.py') != ''
        working-directory: numsim-rvegen/rvegen
        env:
          CXX: g++-14
          # scikit-build-core forwards CMAKE_ARGS through to the rvegen
          # CMake configure during `pip install`. Point it at the installed
          # numsim-core, and skip rvegen's ctest binaries (already built and
          # tested above) with -DBUILD_TESTING=OFF.
          CMAKE_ARGS: "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps -DBUILD_TESTING=OFF"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -v ./python
          pytest python/tests/
